<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Management System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎓 Student Management System</h1>
    <p>Complete CRUD-Based Web Application</p>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id" />

        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" required />
          <span class="error-message" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" required />
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="roll_number">Roll Number *</label>
          <input type="text" id="roll_number" required />
          <span class="error-message" id="roll_number-error"></span>
        </div>

        <div class="form-group">
          <label for="department">Department *</label>
          <input type="text" id="department" required />
          <span class="error-message" id="department-error"></span>
        </div>

        <div class="form-group">
          <label for="year">Year *</label>
          <select id="year" required>
            <option value="">Select year</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
            <option value="5">Year 5</option>
          </select>
          <span class="error-message" id="year-error"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone (10 digits, optional)</label>
          <input type="text" id="phone" maxlength="10" />
          <span class="error-message" id="phone-error"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
        </div>
      </form>
      <div id="form-status" class="status-message"></div>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Students</h2>
        <input type="search" id="search-box" placeholder="Search by name, roll no, department..." />
      </div>

      <div id="list-status" class="status-message"></div>

      <div class="table-wrapper">
        <table id="student-table">
          <thead>
            <tr>
              <th>Roll No.</th>
              <th>Name</th>
              <th>Email</th>
              <th>Department</th>
              <th>Year</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <!-- Rows injected by app.js -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>Built following the SOP: Complete CRUD-Based Web Application Development</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
